<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic-Tac-Toe - FrivLegion Arcade</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at center, #0e1c2f 0%, #050a14 100%);
      color: #e2e8f0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      user-select: none;
    }

    .app {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      gap: 12px;
    }

    .hud {
      width: 100%;
      max-width: 440px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 12px;
      padding: 10px 16px;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.16);
    }

    .title-block {
      display: flex;
      flex-direction: column;
    }

    .title {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #38bdf8;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
    }

    .subtitle {
      font-size: 0.72rem;
      color: #94a3b8;
    }

    .stats {
      display: flex;
      gap: 14px;
    }

    .stat-box {
      text-align: right;
    }

    .stat-label {
      font-size: 0.66rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #64748b;
    }

    .stat-value {
      font-size: 1.15rem;
      font-weight: 800;
      color: #f8fafc;
      font-variant-numeric: tabular-nums;
    }

    .stat-value.accent {
      color: #38bdf8;
      text-shadow: 0 0 8px rgba(56, 189, 248, 0.5);
    }

    .status-banner {
      font-size: 0.88rem;
      font-weight: 600;
      color: #cbd5e1;
      letter-spacing: 0.5px;
      min-height: 1.3em;
    }

    .board-container {
      position: relative;
      width: min(82vw, 62vh, 390px);
      height: min(82vw, 62vh, 390px);
      background: rgba(10, 17, 32, 0.94);
      border: 2px solid #38bdf8;
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 0 28px rgba(56, 189, 248, 0.25), inset 0 0 24px rgba(56, 189, 248, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .board {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 12px;
    }

    .cell {
      background: linear-gradient(145deg, #132038 0%, #0b1324 100%);
      border: 1.5px solid rgba(56, 189, 248, 0.35);
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      font-weight: 900;
      transition: transform 0.12s ease, border-color 0.15s ease, box-shadow 0.15s ease;
      outline: none;
    }

    .cell:hover:not(:disabled) {
      border-color: #38bdf8;
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.35);
      transform: scale(1.02);
    }

    .cell:disabled {
      cursor: default;
    }

    .cell.mark-x {
      color: #38bdf8;
      text-shadow: 0 0 14px rgba(56, 189, 248, 0.75);
    }

    .cell.mark-o {
      color: #fb7185;
      text-shadow: 0 0 14px rgba(251, 113, 133, 0.75);
    }

    .cell.winning {
      border-color: #facc15;
      box-shadow: 0 0 20px rgba(250, 204, 21, 0.6), inset 0 0 14px rgba(250, 204, 21, 0.25);
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(5, 10, 20, 0.9);
      backdrop-filter: blur(5px);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      gap: 14px;
      transition: opacity 0.22s ease;
      z-index: 10;
    }

    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .overlay-title {
      font-size: 1.85rem;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #38bdf8;
      text-shadow: 0 0 16px rgba(56, 189, 248, 0.75);
    }

    .overlay-title.loss {
      color: #fb7185;
      text-shadow: 0 0 16px rgba(251, 113, 133, 0.75);
    }

    .overlay-title.draw {
      color: #facc15;
      text-shadow: 0 0 16px rgba(250, 204, 21, 0.75);
    }

    .overlay-details {
      font-size: 1rem;
      color: #cbd5e1;
      line-height: 1.5;
    }

    .overlay-details strong {
      color: #38bdf8;
      font-size: 1.3rem;
    }

    .btn {
      cursor: pointer;
      background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
      color: #041322;
      font-weight: 800;
      font-size: 0.95rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      border: none;
      border-radius: 999px;
      padding: 11px 28px;
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.55);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }

    .btn:hover {
      transform: translateY(-1px) scale(1.03);
      box-shadow: 0 0 24px rgba(56, 189, 248, 0.85);
    }

    .footer-hint {
      font-size: 0.76rem;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="hud">
      <div class="title-block">
        <div class="title">Tic-Tac-Toe</div>
        <div class="subtitle">+100 Win / +25 Draw</div>
      </div>
      <div class="stats">
        <div class="stat-box">
          <div class="stat-label">Score</div>
          <div class="stat-value accent" id="scoreDisplay">0</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">W-D-L</div>
          <div class="stat-value" id="recordDisplay">0-0-0</div>
        </div>
      </div>
    </div>

    <div class="status-banner" id="statusBanner">Your turn (X) — Select a square</div>

    <div class="board-container">
      <div class="board" id="board"></div>

      <div class="overlay hidden" id="overlay">
        <div class="overlay-title" id="overlayTitle">Victory!</div>
        <div class="overlay-details" id="overlayDetails">
          Round bonus: <span id="roundBonus">+100</span><br />
          Session Score: <strong id="finalScore">100</strong>
        </div>
        <button class="btn" id="playAgainBtn" type="button">Play Again</button>
      </div>
    </div>

    <div class="footer-hint">
      You play as <strong style="color:#38bdf8;">X</strong> against the tactical <strong style="color:#fb7185;">O</strong> AI.
    </div>
  </div>

  <script>
    (function () {
      const GAME_ID = 'tic-tac-toe';
      const WIN_LINES = [
        [0, 1, 2],
        [3, 4, 5],
        [6, 7, 8],
        [0, 3, 6],
        [1, 4, 7],
        [2, 5, 8],
        [0, 4, 8],
        [2, 4, 6]
      ];

      const boardEl = document.getElementById('board');
      const scoreDisplay = document.getElementById('scoreDisplay');
      const recordDisplay = document.getElementById('recordDisplay');
      const statusBanner = document.getElementById('statusBanner');
      const overlay = document.getElementById('overlay');
      const overlayTitle = document.getElementById('overlayTitle');
      const roundBonusEl = document.getElementById('roundBonus');
      const finalScoreEl = document.getElementById('finalScore');
      const playAgainBtn = document.getElementById('playAgainBtn');

      let board = Array(9).fill(null);
      let currentScore = 0;
      let wins = 0;
      let draws = 0;
      let losses = 0;
      let isPlayerTurn = true;
      let isRoundOver = false;

      function emitScore(score) {
        if (window.parent) {
          window.parent.postMessage({
            type: 'FRIVLEGION_SCORE',
            gameId: GAME_ID,
            score: score
          }, '*');
        }
      }

      function emitSaveState() {
        if (window.parent) {
          window.parent.postMessage({
            type: 'FRIVLEGION_SAVE_STATE',
            gameId: GAME_ID,
            state: {
              currentScore: currentScore,
              wins: wins,
              draws: draws,
              losses: losses,
              board: board
            }
          }, '*');
        }
      }

      window.addEventListener('message', function (event) {
        const data = event.data;
        if (!data || typeof data !== 'object') return;
        if (data.type === 'FRIVLEGION_LOAD_STATE' && data.state) {
          const st = data.state;
          if (typeof st.currentScore === 'number') currentScore = st.currentScore;
          if (typeof st.wins === 'number') wins = st.wins;
          if (typeof st.draws === 'number') draws = st.draws;
          if (typeof st.losses === 'number') losses = st.losses;
          updateHud();
        }
      });

      function updateHud() {
        scoreDisplay.textContent = String(currentScore);
        recordDisplay.textContent = wins + '-' + draws + '-' + losses;
      }

      function checkWin(currentBoard) {
        for (let i = 0; i < WIN_LINES.length; i++) {
          const line = WIN_LINES[i];
          const a = line[0], b = line[1], c = line[2];
          if (
            currentBoard[a] &&
            currentBoard[a] === currentBoard[b] &&
            currentBoard[a] === currentBoard[c]
          ) {
            return { winner: currentBoard[a], line: line };
          }
        }
        const isFull = currentBoard.every(function (cell) { return cell !== null; });
        if (isFull) {
          return { winner: 'DRAW', line: [] };
        }
        return null;
      }

      function findTacticalMove(mark) {
        for (let i = 0; i < WIN_LINES.length; i++) {
          const line = WIN_LINES[i];
          const values = [board[line[0]], board[line[1]], board[line[2]]];
          const markCount = values.filter(function (v) { return v === mark; }).length;
          const emptyIndexInLine = values.indexOf(null);
          if (markCount === 2 && emptyIndexInLine !== -1) {
            return line[emptyIndexInLine];
          }
        }
        return -1;
      }

      function chooseAiMove() {
        // 1. Take immediate winning move if available
        const winMove = findTacticalMove('O');
        if (winMove !== -1) return winMove;

        // 2. Block player's immediate winning move
        const blockMove = findTacticalMove('X');
        if (blockMove !== -1) return blockMove;

        // 3. Take center if free
        if (board[4] === null && Math.random() < 0.75) {
          return 4;
        }

        // 4. Prefer corners, then any open cell
        const corners = [0, 2, 6, 8].filter(function (idx) { return board[idx] === null; });
        if (corners.length > 0) {
          return corners[Math.floor(Math.random() * corners.length)];
        }

        const available = [];
        for (let i = 0; i < 9; i++) {
          if (board[i] === null) available.push(i);
        }
        return available.length > 0 ? available[Math.floor(Math.random() * available.length)] : -1;
      }

      function renderBoard(winningLine) {
        boardEl.innerHTML = '';
        for (let i = 0; i < 9; i++) {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'cell';
          btn.setAttribute('aria-label', 'Cell ' + (i + 1));

          const val = board[i];
          if (val === 'X') {
            btn.textContent = 'X';
            btn.classList.add('mark-x');
          } else if (val === 'O') {
            btn.textContent = 'O';
            btn.classList.add('mark-o');
          }

          if (winningLine && winningLine.indexOf(i) !== -1) {
            btn.classList.add('winning');
          }

          if (val !== null || !isPlayerTurn || isRoundOver) {
            btn.disabled = true;
          }

          btn.addEventListener('click', (function (index) {
            return function () {
              onPlayerMove(index);
            };
          })(i));

          boardEl.appendChild(btn);
        }
      }

      function finishRound(result) {
        isRoundOver = true;
        renderBoard(result.line);

        let bonusText = '+0';
        overlayTitle.className = 'overlay-title';

        if (result.winner === 'X') {
          wins += 1;
          currentScore += 100;
          bonusText = '+100';
          overlayTitle.textContent = 'You Win!';
          statusBanner.textContent = 'Victory! +100 points awarded';
        } else if (result.winner === 'DRAW') {
          draws += 1;
          currentScore += 25;
          bonusText = '+25';
          overlayTitle.textContent = 'Draw Round';
          overlayTitle.classList.add('draw');
          statusBanner.textContent = 'Stalemate! +25 points awarded';
        } else {
          losses += 1;
          bonusText = '+0';
          overlayTitle.textContent = 'AI Wins';
          overlayTitle.classList.add('loss');
          statusBanner.textContent = 'AI took the round';
        }

        updateHud();
        roundBonusEl.textContent = bonusText;
        finalScoreEl.textContent = String(currentScore);

        setTimeout(function () {
          overlay.classList.remove('hidden');
        }, 380);

        emitScore(currentScore);
        emitSaveState();
      }

      function onPlayerMove(index) {
        if (isRoundOver || !isPlayerTurn || board[index] !== null) return;

        board[index] = 'X';
        isPlayerTurn = false;

        const playerCheck = checkWin(board);
        if (playerCheck) {
          finishRound(playerCheck);
          return;
        }

        statusBanner.textContent = 'AI is calculating move...';
        renderBoard([]);

        setTimeout(function () {
          if (isRoundOver) return;
          const aiIdx = chooseAiMove();
          if (aiIdx !== -1) {
            board[aiIdx] = 'O';
          }

          const aiCheck = checkWin(board);
          if (aiCheck) {
            finishRound(aiCheck);
            return;
          }

          isPlayerTurn = true;
          statusBanner.textContent = 'Your turn (X) — Select a square';
          renderBoard([]);
        }, 280);
      }

      function startNewRound() {
        board = Array(9).fill(null);
        isPlayerTurn = true;
        isRoundOver = false;
        overlay.classList.add('hidden');
        statusBanner.textContent = 'Your turn (X) — Select a square';
        updateHud();
        renderBoard([]);
      }

      playAgainBtn.addEventListener('click', function () {
        startNewRound();
      });

      startNewRound();
    })();
  </script>
</body>
</html>
