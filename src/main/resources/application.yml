allowed-origins: http://localhost:3000
jwt:
  # No fallback (#40): startup fails if JWT_SECRET is not set. The dev and test profiles define their own.
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
spring:
  h2:
    console:
      enabled: false
  flyway:
    enabled: true
frivlegion:
  admin:
    username: ${ADMIN_USERNAME:}
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
